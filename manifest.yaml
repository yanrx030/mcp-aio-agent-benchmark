version: 1


openrouter:
  defaults:
    temperature: 0.0
    top_p: 1.0
    # top_k: 0
    # min_p: 0.0
    # frequency_penalty: 0.0
    # presence_penalty: 0.0
    # repetition_penalty: 1.0
    stream: false
    tool_choice: "auto"
    #parallel_tool_calls: false

model_catalog:
  # Tool-using agent candidates

  - id: "qwen/qwen3.6-plus" # doesn't support parameter "parallel_tool_calls"
    role: "tool_agent"
    openrouter:
      provider:
        order: ["alibaba"]       
        allow_fallbacks: false
        require_parameters: true
        

  - id: "anthropic/claude-sonnet-4.6"
    role: "tool_agent"
    openrouter:
      provider:
        order: ["anthropic"]       
        allow_fallbacks: false
        require_parameters: true

  
  - id: "nvidia/nemotron-3-super-120b-a12b:free"
    role: "tool_agent"
    openrouter:
      provider:
        order: ["nvidia"]       
        allow_fallbacks: false


        
#for testing only!!!
  - id: "meta-llama/llama-3.1-8b-instruct"
    role: "tool_agent"
    openrouter:
       allow_fallbacks: true
  
  - id: "nvidia/nemotron-3-super-120b-a12b"
    role: "tool_agent"
    




  # Judge model candidates
  - id: "openai/gpt-5.4-mini"
    role: "judge"
    openrouter:
      provider:
        order: ["openai"]          
        allow_fallbacks: false
        require_parameters: true

profiles:
  default:
    tool_agent_candidates:
      - "qwen/qwen3.6-plus"
    judge_candidates:
      - "openai/gpt-5.4-mini" #not implemented yet
    openrouter_override: {}        # optional

