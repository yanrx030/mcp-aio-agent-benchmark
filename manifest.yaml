version: 1

openrouter:
  defaults:
    temperature: 0.0
    top_p: 1.0
    stream: false
    tool_choice: "auto"

model_catalog:
  # Tool-using agent candidates

  - id: "qwen/qwen3.6-plus" # doesn't support "parallel_tool_calls"
    role: "tool_agent"
    openrouter:
      provider:
        order: ["alibaba"]
        allow_fallbacks: false
        require_parameters: true

  - id: "anthropic/claude-sonnet-4.6"
    role: "tool_agent"
    openrouter:
      provider:
        order: ["anthropic"]
        allow_fallbacks: false
        require_parameters: true


  - id: "openai/gpt-5.5" #Temperature and top_p parms not supported
    role: "tool_agent"
    openrouter:
      provider:
        order: ["openai"]
        allow_fallbacks: false
        require_parameters: true

        
  - id: "anthropic/claude-opus-4.6"
    role: "tool_agent"
    openrouter:
      provider:
        order: ["anthropic"]
        allow_fallbacks: false
        require_parameters: true

  
  #open source

  - id: "moonshotai/kimi-k2.6"
    role: "tool_agent"
    openrouter:
      provider:
        order: ["deepinfra/fp4"]
        allow_fallbacks: false
        require_parameters: true

  - id: "meta-llama/llama-4-scout"
    role: "tool_agent"
    openrouter:
      provider:
        order: ["deepinfra/fp8"]
        allow_fallbacks: true
        require_parameters: true

  #for testing only!!!
  - id: "nvidia/nemotron-3-super-120b-a12b:free"
    role: "tool_agent"
    openrouter:
      provider:
        order: ["nvidia"]
        allow_fallbacks: false



  # Judge model candidates

  - id: "google/gemini-2.5-pro"
    role: "judge"
    openrouter:
      provider:
        order: ["google-vertex/global"]
        allow_fallbacks: false
        require_parameters: true

profiles:
  default:
    tool_agent_candidates:
      #- "moonshotai/kimi-k2.6"
      - "anthropic/claude-opus-4.6"
    judge_candidates:
      - "google/gemini-2.5-pro"
    openrouter_override: {}
